name: Deploy frontend (S3 + CloudFront)

# Manual only. Builds the SPA and publishes it to the site bucket behind CloudFront in the
# org AWS account (864145505327). Run it from the main branch: the AWS role only trusts main.
#
# No stored AWS keys: GitHub proves its identity to AWS with OIDC and assumes
# mostatelax-github-web-deploy, which can only write the one site bucket and invalidate the one
# distribution.
#
# Required repository variables (Settings > Secrets and variables > Actions > Variables)
# - these mirror the local .env, which is intentionally NOT in git:
#   VITE_API_BASE                 https://api.missouristatelacrosse.com
#   VITE_PAYMENT_PROVIDER         paypal | stripe
#   VITE_PAYMENT_PROVIDER_WOMEN   paypal | stripe
#   VITE_PAYPAL_CLIENT_ID         (public client id)
#   VITE_STRIPE_PUBLISHABLE_KEY   pk_live_... (public, only needed if provider=stripe)
#   VITE_TEAMSTORE_ENABLED / _WOMEN, VITE_DONATE_ENABLED / _WOMEN   true | false

on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::864145505327:role/mostatelax-github-web-deploy
  SITE_BUCKET: mostatelax-prod-web
  CLOUDFRONT_DISTRIBUTION_ID: EZK3P3OYRIACI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_PAYMENT_PROVIDER: ${{ vars.VITE_PAYMENT_PROVIDER }}
          VITE_PAYMENT_PROVIDER_WOMEN: ${{ vars.VITE_PAYMENT_PROVIDER_WOMEN }}
          VITE_PAYPAL_CLIENT_ID: ${{ vars.VITE_PAYPAL_CLIENT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_TEAMSTORE_ENABLED: ${{ vars.VITE_TEAMSTORE_ENABLED }}
          VITE_TEAMSTORE_ENABLED_WOMEN: ${{ vars.VITE_TEAMSTORE_ENABLED_WOMEN }}
          VITE_DONATE_ENABLED: ${{ vars.VITE_DONATE_ENABLED }}
          VITE_DONATE_ENABLED_WOMEN: ${{ vars.VITE_DONATE_ENABLED_WOMEN }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3
        run: |
          # Hashed asset files never change, so browsers and the CDN can keep them for a year.
          aws s3 sync dist/assets "s3://${SITE_BUCKET}/assets" --delete \
            --cache-control "public,max-age=31536000,immutable"
          # Everything else (index.html, service worker, icons) must be re-checked every time.
          aws s3 sync dist "s3://${SITE_BUCKET}" --exclude "assets/*" --delete \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
