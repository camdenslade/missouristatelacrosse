# Local development profile.
#
# Activate with:  -Dspring.profiles.active=local   or   SPRING_PROFILES_ACTIVE=local
#
# In this profile MainApp SKIPS AWS Secrets Manager - all config comes from here plus
# environment variables (see docker-compose.yml and .env.example at the repo root).
# External integrations that need real credentials (SES email, S3 uploads, Firebase
# token verification, PayPal/Stripe/Printify) will not work locally without those
# credentials; the app still boots and the rest of the API is fully usable.

app.email.enabled=false

# Database - defaults to a local Postgres; docker-compose sets DB_URL to the "db" service.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lacrosse}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Sandbox by default for local (PayPalSDKService also defaults to this).
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}

# Quieter startup than prod.
logging.level.org.springframework.web.client.RestTemplate=WARN
logging.level.org.springframework.http.converter.json=WARN

# No throttle locally.
app.ratelimit.enabled=false
