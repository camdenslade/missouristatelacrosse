spring.application.name=backend
server.port=${PORT:8080}
server.address=0.0.0.0



spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lacrosse}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=men,women
spring.flyway.ignore-migration-patterns=*:missing

app.program.header=X-Program
app.program.default=men
app.s3.bucket=${S3_BUCKET:}
app.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
app.s3.prefix.men=men
app.s3.prefix.women=women

aws.region=${AWS_REGION:us-east-1}
email.fromAddress=no-reply@missouristatelacrosse.com
app.frontend.base-url=${FRONTEND_BASE_URL:https://missouristatelacrosse.com}

printify.api.baseUrl=https://api.printify.com/v1
printify.shopId=${PRINTIFY_SHOP_ID:}
printify.apiToken=${PRINTIFY_API_TOKEN:}
printify.custom-order-notify=${PRINTIFY_CUSTOM_ORDER_EMAIL:17bacole@gmail.com}

paypal.base-url=${PAYPAL_BASE_URL:https://api-m.paypal.com}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.client.id=${PAYPAL_CLIENT_ID:}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.enabled=${STRIPE_ENABLED:true}


spring.web.cors.allowed-origins=https://missouristatelacrosse.com, https://localhost:*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# NOTE: do not raise RestTemplate / json converter logging to DEBUG in prod - it prints
# full outbound request/response bodies, including PayPal OAuth and order payloads.
